[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "context-forge"
version = "0.1.0"
description = "Automated metadata generation for Databricks views with GitHub PR automation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "databricks-sdk",
    "databricks-sql-connector",
    "pygithub",
    "openai",
]

[project.optional-dependencies]
dev = [
    "python-dotenv",
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["context_forge*"]
